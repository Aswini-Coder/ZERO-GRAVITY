name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          # Inject mock strings for compilation step consistency (even though compile doesn't require live values)
          GITHUB_TOKEN: MOCK_TOKEN_CI
          LLM_API_KEY: MOCK_KEY_CI
          LLM_BASE_URL: https://api.openai.com/v1
